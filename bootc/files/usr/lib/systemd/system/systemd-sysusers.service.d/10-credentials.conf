[Unit]
# The shipped unit runs only when ConditionNeedsUpdate=/etc fires, which never
# happens in image mode: /etc is merged fresh from /usr/etc at deploy time, so
# systemd-update-done marks it current and the unit is skipped every boot.
# Empty assignments reset both OR conditions, leaving it unconditional.
# sysusers is idempotent, so running each boot costs nothing.
ConditionNeedsUpdate=
ConditionCredential=
