server:
  # Bind to the cluster IP to avoid external access
  host: 10.42.0.1
  port: 27973

system:
  # cpu-temp-sensor is inferred when unset. `glance-agent sensors:print` lists
  # the names if the guess is wrong.
  cpu-temp-sensor:
  hide-mountpoints-by-default: true
  mountpoints:
    "/var/external":
      hide: false
    "/var":
      hide: false
    "/sysroot":
      hide: false
    "/boot":
      hide: false
