# Files overlaid onto the target by overlay.py, after `./build.py install`.
#
# Each [[entry]] takes:
#   source    path under files/, beside this toml. May be nested; a directory
#             when recursive is set
#   dest      absolute path as the booted system sees it. Must be under /etc,
#             /var or /boot. overlay.py maps it onto disk: /boot/*
#             to the boot partition, /var/* to the stateroot's var, /etc/* into
#             the ostree deployment
#   mode      optional, octal string. Defaults to 0600 when omitted
#   owner     optional, "user:group". Names resolve against the target's own
#             passwd and group; ids work too
#   template  optional, default false. When true the source is read as text and
#             ${...} placeholders are substituted. Leave it off for binaries
#   recursive optional, default false. Copies a whole directory; mode applies
#             to the files in it and directories get 0755
#
# Written files are labelled with `setfiles` against the target's own policy,
# so an enforcing host boots with the right contexts. Pass --no-relabel to
# overlay.py to skip it entirely.
#
# Substitutions come from [vars] below, overridden by KEY=VALUE arguments, so
# secrets are supplied at install time instead of committed.

[vars]
ADMIN_AP_UUID="FDF59677-8186-47F3-9963-5608741C86D2" # randomly generated
# ADMIN_AP_PSK= # passed as an argument
UPSTREAM_WIFI_UUID="AF16958F-AC5B-4D69-830D-FC4E3AD4DDB7" # randomly generated
# UPSTREAM_WIFI_SSID= # passed as an argument
# UPSTREAM_WIFI_PSK= # passed as an argument
HOSTNAME="mini-homelab"
TIMEZONE="America/New_York" # override to local timezone
ADMIN_USER="one49segolte"
ADMIN_UID="1000"
# ADMIN_SSH_KEY= # passed as an argument

# --- Raspberry Pi 4 ESP ---
# From https://docs.fedoraproject.org/en-US/fedora-coreos/provisioning-raspberry-pi4/#_installing_fcos_and_booting_via_u_boot

[[entry]]
source = "rpi"
dest = "/boot/efi"
mode = "0644"
owner = "root:root"
recursive = true

# --- Machine basics ---

[[entry]]
source = "system/hostname"
dest = "/etc/hostname"
mode = "0644"
owner = "root:root"
template = true

[[entry]]
source = "system/tmpfiles.conf"
dest = "/etc/tmpfiles.d/10-system.conf"
mode = "0644"
owner = "root:root"
template = true

# --- Users ---

[[entry]]
source = "users/sysusers.conf"
dest = "/etc/sysusers.d/10-admin.conf"
mode = "0644"
owner = "root:root"
template = true

[[entry]]
source = "users/tmpfiles.conf"
dest = "/etc/tmpfiles.d/10-admin.conf"
mode = "0644"
owner = "root:root"
template = true

# --- Networking ---

[[entry]]
source = "networking/admin-ap.nmconnection"
dest = "/etc/NetworkManager/system-connections/admin-ap.nmconnection"
mode = "0600"
owner = "root:root"
template = true

[[entry]]
source = "networking/upstream.nmconnection"
dest = "/etc/NetworkManager/system-connections/upstream.nmconnection"
mode = "0600"
owner = "root:root"
template = true
