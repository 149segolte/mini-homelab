apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: validate-pod-security-restricted
spec:
  failurePolicy: Fail
  background: false
  rules:
    - name: restricted
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
      validate:
        failureAction: Enforce
        podSecurity:
          level: restricted
          version: latest
