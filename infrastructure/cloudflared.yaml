apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  # The ExternalSecret cannot resolve until the ClusterSecretStore exists.
  dependsOn:
    - name: external-secrets-crs
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/cloudflared
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
