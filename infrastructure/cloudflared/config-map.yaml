apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: fc82902e-7417-43d0-8ce7-30aff1a83d75
    credentials-file: /etc/cloudflared/creds/credentials.json

    # Bound to all interfaces on a fixed port so the readiness probe can reach
    # /ready; the default binds to loopback on a random port.
    metrics: 0.0.0.0:2000

    no-autoupdate: true
    ingress:
      - service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          # Traefik still serves its default self-signed cert. Swap for
          # originServerName once cert-manager issues the wildcard.
          noTLSVerify: true
      - service: http_status:404
