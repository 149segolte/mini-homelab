tunnel: fc82902e-7417-43d0-8ce7-30aff1a83d75
credentials-file: /etc/cloudflared/creds/credentials.json

# Bound to all interfaces on a fixed port so the readiness probe can reach
# /ready; the default binds to loopback on a random port.
metrics: 0.0.0.0:2000

no-autoupdate: true
ingress:
  - service: https://traefik.kube-system.svc.cluster.local:443
    originRequest:
      # The service DNS name is not on the wildcard, so verification is done
      # against the apex instead. Only TLS: the original Host header is what
      # Traefik routes on.
      originServerName: ${DOMAIN}
