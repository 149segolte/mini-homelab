apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  namespace: blocky
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blocky
  template:
    metadata:
      labels:
        app: blocky
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: blocky
          image: ghcr.io/0xerr0r/blocky:v0.35.0
          env:
            - name: TZ
              value: ${TIMEZONE}
          ports:
            - name: dns-udp
              containerPort: 5300
              protocol: UDP
            - name: dns-tcp
              containerPort: 5300
              protocol: TCP
            - name: http
              containerPort: 4000
              protocol: TCP
          readinessProbe:
            exec:
              command: ["/app/blocky", "healthcheck", "--port", "5300"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["/app/blocky", "healthcheck", "--port", "5300"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: blocky
