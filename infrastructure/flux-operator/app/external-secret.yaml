apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-web-config
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: flux-web-config
    template:
      engineVersion: v2
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux.${DOMAIN}
            authentication:
              type: OAuth2
              oauth2:
                provider: OIDC
                issuerURL: https://auth.${DOMAIN}
                clientID: "{{ .client_id }}"
                clientSecret: "{{ .client_secret }}"
            impersonation:
              username: "claims.preferred_username"
              groups: "claims.groups"
  data:
    - secretKey: client_id
      remoteRef:
        key: authelia/oidc/clients/flux/id
    - secretKey: client_secret
      remoteRef:
        key: authelia/oidc/clients/flux/secret
