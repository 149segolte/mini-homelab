apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # One wildcard served as the default certificate, so no Ingress needs a
    # `tls` block and no secret has to be replicated per namespace.
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard-tls

    # Allow middlewares to exist in a separate namespace from Traefik.
    providers:
      kubernetesCRD:
        allowCrossNamespace: true

    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.${DOMAIN}`)
        entryPoints:
          - websecure

    logs:
      access:
        enabled: true
        format: json

    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          middlewares:
            - authelia-authelia@kubernetescrd
