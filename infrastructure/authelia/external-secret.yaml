apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: authelia
    template:
      engineVersion: v2
      data:
        session_secret: "{{ .session_secret }}"
        storage_encryption_key: "{{ .storage_encryption_key }}"
        users_database.yml: |
          users:
          {{- range $name, $user := .users | fromJson }}
            {{ $name | quote }}:
              displayname: {{ $user.displayname | quote }}
              password: {{ $user.password | quote }}
              email: {{ $user.email | quote }}
              groups: {{ $user.groups | toJson }}
          {{- end }}
        oidc.yml: |
          identity_providers:
            oidc:
              hmac_secret: '{{ .oidc_hmac_secret }}'
              # The Flux UI reads claims from the ID token only, so without
              # hydrating them here its groups arrive empty and impersonation
              # grants nothing.
              claims_policies:
                flux:
                  id_token:
                    - 'preferred_username'
                    - 'email'
                    - 'groups'
              jwks:
                - algorithm: 'RS256'
                  key: |
                    {{- .oidc_jwks_key | trim | nindent 10 }}
              clients:
                - client_id: '{{ .oidc_flux_id }}'
                  claims_policy: 'flux'
                  client_name: 'Flux Operator'
                  client_secret: '{{ .oidc_flux_secret_hash }}'
                  redirect_uris:
                    - 'https://flux.${DOMAIN}/oauth2/callback'
                  scopes:
                    - 'openid'
                    - 'offline_access'
                    - 'profile'
                    - 'email'
                    - 'groups'
                - client_id: '{{ .oidc_grafana_id }}'
                  client_name: 'Grafana'
                  client_secret: '{{ .oidc_grafana_secret_hash }}'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  redirect_uris:
                    - 'https://grafana.${DOMAIN}/login/generic_oauth'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'email'
                    - 'groups'
  data:
    - secretKey: users
      remoteRef:
        key: users
    - secretKey: session_secret
      remoteRef:
        key: authelia/session-secret
    - secretKey: storage_encryption_key
      remoteRef:
        key: authelia/storage-encryption-key

    - secretKey: oidc_hmac_secret
      remoteRef:
        key: authelia/oidc/hmac-secret
    - secretKey: oidc_jwks_key
      remoteRef:
        key: authelia/oidc/jwks-key/private.pem
    - secretKey: oidc_flux_id
      remoteRef:
        key: authelia/oidc/clients/flux/id
    - secretKey: oidc_flux_secret_hash
      remoteRef:
        key: authelia/oidc/clients/flux/secret-hash
    - secretKey: oidc_grafana_id
      remoteRef:
        key: authelia/oidc/clients/grafana/id
    - secretKey: oidc_grafana_secret_hash
      remoteRef:
        key: authelia/oidc/clients/grafana/secret-hash
