apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - middleware.yaml

# Generated so a config change rolls the pod; a plain ConfigMap would not.
configMapGenerator:
  - name: authelia
    namespace: authelia
    files:
      - configuration.yml
