apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: authelia
  data:
    - secretKey: session_secret
      remoteRef:
        key: authelia/session-secret
    - secretKey: storage_encryption_key
      remoteRef:
        key: authelia/storage-encryption-key
    # The whole users_database.yml as one value. Argon2 hashes only.
    - secretKey: users_database.yml
      remoteRef:
        key: authelia/users-database
