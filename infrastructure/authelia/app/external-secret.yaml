apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: authelia
    template:
      engineVersion: v2
      data:
        session_secret: "{{ .session_secret }}"
        storage_encryption_key: "{{ .storage_encryption_key }}"
        users_database.yml: |
          users:
            149segolte:
              disabled: false
              displayname: 'Shreyansh Nayak'
              password: '{{ .user_149segolte_hash }}'
              email: 'me@149segolte.dev'
              groups:
                - 'admins'
                - 'users'
            testuser:
              disabled: false
              displayname: 'Test User'
              password: '{{ .user_testuser_hash }}'
              email: 'testuser@149segolte.dev'
              groups:
                - 'users'
        oidc.yml: |
          identity_providers:
            oidc:
              hmac_secret: '{{ .oidc_hmac_secret }}'
              jwks:
                - algorithm: 'RS256'
                  key: |
                    {{- .oidc_jwks_key | trim | nindent 10 }}
              clients:
                - client_id: '{{ .oidc_flux_id }}'
                  client_name: 'Flux Operator'
                  client_secret: '{{ .oidc_flux_secret_hash }}'
                  redirect_uris:
                    - 'https://flux.${DOMAIN}/oauth2/callback'
                  scopes:
                    - 'openid'
                    - 'offline_access'
                    - 'profile'
                    - 'email'
                    - 'groups'
                - client_id: '{{ .oidc_technitium_id }}'
                  client_name: 'Technitium'
                  client_secret: '{{ .oidc_technitium_secret_hash }}'
                  redirect_uris:
                    - 'https://dns.${DOMAIN}/sso/callback'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
  dataFrom:
    - find:
        path: /authelia/user-password-hashes
      rewrite:
        - transform:
            template: "user_{{.value}}_hash"
  data:
    - secretKey: session_secret
      remoteRef:
        key: authelia/session-secret
    - secretKey: storage_encryption_key
      remoteRef:
        key: authelia/storage-encryption-key

    - secretKey: oidc_hmac_secret
      remoteRef:
        key: authelia/oidc/hmac-secret
    - secretKey: oidc_jwks_key
      remoteRef:
        key: authelia/oidc/jwks-key/private.pem
    - secretKey: oidc_flux_id
      remoteRef:
        key: authelia/oidc/clients/flux/id
    - secretKey: oidc_flux_secret_hash
      remoteRef:
        key: authelia/oidc/clients/flux/secret-hash
    - secretKey: oidc_technitium_id
      remoteRef:
        key: authelia/oidc/clients/technitium/id
    - secretKey: oidc_technitium_secret_hash
      remoteRef:
        key: authelia/oidc/clients/technitium/secret-hash
