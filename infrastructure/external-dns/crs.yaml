apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-crs
  namespace: flux-system
spec:
  dependsOn:
    - name: external-dns-operator
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/external-dns/crs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
