apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.20.0
          args:
            - --source=crd
            - --source=ingress
            # traefik. is an IngressRoute from the chart, not an Ingress.
            - --source=traefik-proxy
            - --domain-filter=${DOMAIN}
            - --provider=rfc2136
            - --rfc2136-host=10.43.0.53
            - --rfc2136-port=53
            - --rfc2136-zone=${DOMAIN}
            - --rfc2136-tsig-keyname=external-dns-tsig
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-tsig-axfr
            - --policy=sync
            - --registry=txt
            - --txt-prefix=external-dns-
            - --txt-owner-id=mini-homelab
          env:
            - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: external-dns-tsig
                  key: secret
          ports:
            - name: http
              containerPort: 7979
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
