apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: external-dns-crds
    - name: external-secrets-crs
  interval: 10m
  timeout: 10m
  path: ./infrastructure/external-dns/operator
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
