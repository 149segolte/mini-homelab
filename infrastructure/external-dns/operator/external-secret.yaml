apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-tsig
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: external-dns-tsig
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: external-dns/tsig-secret
