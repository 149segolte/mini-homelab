apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 30m
  releaseName: external-dns
  targetNamespace: external-dns
  chart:
    spec:
      chart: external-dns
      version: "1.22.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  # The chart carries the CRD in crds/, which Helm installs but never upgrades.
  # The crds Kustomization owns it instead.
  install:
    crds: Skip
  upgrade:
    crds: Skip
  values:
    sources:
      - crd
      - ingress
      # traefik. is an IngressRoute from the chart, not an Ingress.
      - traefik-proxy
    policy: sync
    registry: txt
    txtOwnerId: mini-homelab
    txtPrefix: zzz-external-dns-
    domainFilters:
      - ${DOMAIN}
    provider:
      name: rfc2136
    extraArgs:
      - --rfc2136-host=10.43.0.53
      - --rfc2136-port=53
      - --rfc2136-zone=${DOMAIN}
      - --rfc2136-tsig-keyname=external-dns-tsig
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-axfr
      - --rfc2136-batch-change-size=1
      - --rfc2136-min-ttl=5m
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: external-dns-tsig
            key: secret
