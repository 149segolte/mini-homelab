apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  # The counterpart to cluster-vars, for values that may not sit in git.
  target:
    name: cluster-secrets
  data:
    - secretKey: COPYPARTY_IDP_HEADER
      remoteRef:
        key: copyparty/idp-header
