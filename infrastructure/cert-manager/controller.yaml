apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-controller
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  path: ./infrastructure/cert-manager/controller
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
