apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    # To flip: swap to https://acme-v02.api.letsencrypt.org/directory and
    # delete the wildcard-tls secret so it re-issues.
    #server: https://acme-staging-v02.api.letsencrypt.org/directory
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL:?set ACME_EMAIL in initialization/bootstrap.yaml}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: token
