apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  # kube-system because that is where the bundled Traefik and its TLSStore
  # live, and Traefik reads secretName from its own namespace.
  namespace: kube-system
spec:
  secretName: wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  commonName: "${DOMAIN}"
  dnsNames:
    - "${DOMAIN}"
    - "*.${DOMAIN}"
