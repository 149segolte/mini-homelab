apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: technitium-admin
  namespace: technitium
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: technitium-admin
  data:
    - secretKey: password
      remoteRef:
        key: technitium/initial-admin-password
