apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium
  namespace: technitium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: technitium
          image: technitium/dns-server:15.4.0
          # First-run only, like everything DNS_SERVER_*: inert against the
          # existing store. Rebuild to configure.
          env:
            - name: DNS_SERVER_ADMIN_PASSWORD_FILE
              value: /run/secrets/technitium/password
            - name: DNS_SERVER_SSO_ENABLED
              value: "true"
            - name: DNS_SERVER_SSO_AUTHORITY
              value: https://auth.${DOMAIN}
            - name: DNS_SERVER_SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: technitium-user-config
                  key: sso_client_id
            - name: DNS_SERVER_SSO_CLIENT_SECRET_FILE
              value: /run/secrets/technitium/sso_client_secret
            - name: DNS_SERVER_SSO_SCOPES
              value: openid,profile,groups
            - name: DNS_SERVER_SSO_ALLOW_SIGNUP
              value: "false"
            - name: DNS_SERVER_SSO_ALLOW_SIGNUP_ONLY_FOR_MAPPED_USERS
              value: "true"
            - name: DNS_SERVER_SSO_GROUP_MAP
              value: admins:Administrators
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
              hostPort: 5335
              hostIP: 127.0.0.1
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
              hostPort: 5335
              hostIP: 127.0.0.1
            - name: http
              containerPort: 5380
            - name: doh
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: config
              mountPath: /etc/dns
            - name: admin
              mountPath: /run/secrets/technitium
              readOnly: true
            - name: logs
              mountPath: /var/log/technitium
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: technitium
        - name: admin
          secret:
            secretName: technitium-user-config
            items:
              - key: password
                path: password
              - key: sso_client_secret
                path: sso_client_secret
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
