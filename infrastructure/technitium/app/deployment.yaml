apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium
  namespace: technitium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: technitium
  template:
    metadata:
      labels:
        app: technitium
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: technitium
          image: technitium/dns-server:15.4.0
          # DNS_SERVER_* is read only when /etc/dns holds no config — first run only.
          env:
            - name: DNS_SERVER_ADMIN_PASSWORD_FILE
              value: /run/secrets/technitium/password
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
              hostPort: 5335
              hostIP: 127.0.0.1
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
              hostPort: 5335
              hostIP: 127.0.0.1
            - name: http
              containerPort: 5380
            - name: doh
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: config
              mountPath: /etc/dns
            - name: admin
              mountPath: /run/secrets/technitium
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: technitium
        - name: admin
          secret:
            secretName: technitium-admin
            items:
              - key: password
                path: password
