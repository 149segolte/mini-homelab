apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: technitium
  namespace: flux-system
spec:
  # The ExternalSecret cannot resolve until the ClusterSecretStore exists.
  dependsOn:
    - name: external-secrets-crs
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/technitium/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
