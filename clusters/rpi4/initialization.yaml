apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: initialization
  namespace: flux-system
spec:
  interval: 10m
  timeout: 2m
  retryInterval: 1m
  path: ./initialization
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
