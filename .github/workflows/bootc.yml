name: bootc

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootc.yml
      - bootc/**
      - build.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootc.yml
      - bootc/**
      - build.py
  workflow_dispatch:

concurrency:
  group: bootc-${{ github.ref }}
  # A superseded pull request run is wasted work. A push run may be mid-push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_REF: ${{ github.head_ref || github.ref_name }}
  GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
  QUAY_REGISTRY: quay.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag
        id: vars
        run: |
          if [ "${GIT_REF}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Podman
        uses: redhat-actions/podman-install@v1

      - name: Set up `uv`
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Also the build cache, so this runs on a pull request too.
      - name: Log in to ghcr.io
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.GHCR_REGISTRY }}

      # A passing build is also a passing `bootc container lint`.
      - name: Build
        run: ./build.py build --tag ${{ steps.vars.outputs.tag }} --cache-registry ${{ env.GHCR_REGISTRY }}

      - name: Log in to quay.io
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v1
        with:
          username: ${{ secrets.QUAY_REGISTRY_USER }}
          password: ${{ secrets.QUAY_REGISTRY_PASSWORD }}
          registry: ${{ env.QUAY_REGISTRY }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          ./build.py push --tag ${{ steps.vars.outputs.tag }} ${{ env.GHCR_REGISTRY }}
          ./build.py push --tag ${{ steps.vars.outputs.tag }} ${{ env.QUAY_REGISTRY }}
