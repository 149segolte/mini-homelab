name: bootc-ci

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootc*
      - bootc/**
      - build.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootc*
      - bootc/**
      - build.py
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_REF: ${{ github.head_ref || github.ref_name }}
  GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lint-and-build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag
        id: vars
        run: |
          if [ "${GIT_REF}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Podman
        uses: redhat-actions/podman-install@v1

      - name: Set up `uv`
        uses: astral-sh/setup-uv@v10

      # A passing build is also a passing `bootc container lint`.
      - name: Build
        run: ./build.py build --tag ${{ steps.vars.outputs.tag }}

