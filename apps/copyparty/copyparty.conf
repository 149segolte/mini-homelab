[global]
  # Various features
  e2dsa    # Filesystem index, search, deduplication and upload resume.
  ed       # Allow clients to see dotfiles.
  site: https://files.${DOMAIN}
  https-only
  xff-src: lan

  # SFTP. Authelia takes no part in this, so copyparty authenticates these
  # connections itself.
  sftp: 3922

  # Set by the Authelia middleware on Traefik's websecure entrypoint.
  idp-h-usr: Remote-User
  idp-h-grp: Remote-Groups

  # IdP config
  idp-h-key: ${COPYPARTY_IDP_HEADER}   # Proof of passing through Traefik.
  idp-login: https://auth.${DOMAIN}
  idp-logout: https://auth.${DOMAIN}/logout
  auth-ord: idp

  # Remember the users seen in the IdP headers.
  idp-store: 2

  # Store persistent state across restarts.
  sftp-hostk: /hist/ssh
  idp-db: /hist/idp.db
  ses-db: /hist/sessions.db
  shr-db: /hist/shared.db

  # Store history and thumbnails outside the data partition. Mapped to a PVC.
  hist: /hist/store/

  # Repeatable, and the username must match the Authelia account.
  sftp-key: 149segolte sk-ssh-ed25519@openssh.com AAAAGnNrLXNzaC1lZDI1NTE5QG9wZW5zc2guY29tAAAAIJf+OIwp58UAZgSAJfgtN5tOoXvSuTiAUFCHYX6DhwvyAAAAEXNzaDpnZW5pZF9wcmltYXJ5 ssh:genid_primary
  sftp-key: 149segolte sk-ssh-ed25519@openssh.com AAAAGnNrLXNzaC1lZDI1NTE5QG9wZW5zc2guY29tAAAAILSkO987357FNA/ptWc9ShOdMWLdcL8/yev0xj1zUDxHAAAAEXNzaDpzZWNpZF9wcmltYXJ5 ssh:secid_primary

# Any account Authelia vouches for, rather than the wildcard, which would
# also admit a request arriving with no identity header at all.
[/]
  /w
  accs:
    rwmda: @acct
  flags:
    # WebDAV clients open a file, write to it and close it. Without daw they
    # can create and replace, but not edit in place.
    daw
