apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copyparty
  namespace: copyparty
  annotations:
    glance/name: Copyparty
    glance/icon: di:copyparty
    glance/url: https://files.${DOMAIN}
spec:
  ingressClassName: traefik
  rules:
    - host: files.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: copyparty
                port:
                  name: http
