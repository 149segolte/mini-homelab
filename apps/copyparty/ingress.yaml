apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copyparty
  namespace: copyparty
  annotations:
    external-dns.kubernetes.io/target: node.${DOMAIN}
    traefik.ingress.kubernetes.io/router.middlewares: copyparty-idp-key@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: files.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: copyparty
                port:
                  name: http
