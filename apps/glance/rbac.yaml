apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glance-k8s
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glance-k8s
subjects:
  - kind: ServiceAccount
    name: glance-k8s
    namespace: glance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glance-k8s
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glance-k8s
  namespace: glance
