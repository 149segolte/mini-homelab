apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      labels:
        app: glance
    spec:
      securityContext:
        runAsNonRoot: true
        # The image has no USER; without this it is root.
        runAsUser: 65534
      containers:
        - name: glance
          image: docker.io/glanceapp/glance:v0.8.6
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: glance-github-token
                  key: token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            # The image's entrypoint is `--config /app/config/glance.yml`.
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: glance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance-k8s
  namespace: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance-k8s
  template:
    metadata:
      labels:
        app: glance-k8s
    spec:
      serviceAccountName: glance-k8s
      securityContext:
        runAsNonRoot: true
        # The image has no USER; without this it is root.
        runAsUser: 65534
      containers:
        - name: glance-k8s
          image: ghcr.io/lukasdietrich/glance-k8s/glance-k8s:v0.5.7
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
