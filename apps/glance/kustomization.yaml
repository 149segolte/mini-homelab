apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Generated rather than hand-written, so the content hash rolls the pod when
# the dashboard changes.
configMapGenerator:
  - name: glance
    namespace: glance
    files:
      - glance.yml
