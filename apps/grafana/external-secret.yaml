apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: grafana
  data:
    - secretKey: client_id
      remoteRef:
        key: authelia/oidc/clients/grafana/id
    - secretKey: client_secret
      remoteRef:
        key: authelia/oidc/clients/grafana/secret
