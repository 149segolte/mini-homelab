[server]
root_url = https://grafana.${DOMAIN}

[log]
mode = console

[security]
disable_initial_admin_creation = true
cookie_secure = true

# Client ID and secret come from the environment.
[auth.generic_oauth]
enabled = true
name = Authelia
auto_login = true
scopes = openid profile email groups
auth_url = https://auth.${DOMAIN}/api/oidc/authorization
token_url = https://auth.${DOMAIN}/api/oidc/token
api_url = https://auth.${DOMAIN}/api/oidc/userinfo
use_pkce = true
login_attribute_path = preferred_username
name_attribute_path = name
groups_attribute_path = groups
# The ID token is searched before userinfo and holds no groups, so a fallback
# role here would always match; non-admins get auto_assign_org_role instead.
role_attribute_path = contains(groups[*], 'admins') && 'Admin'

[users]
auto_assign_org_role = Viewer

[auth]
disable_login_form = true
disable_signout_menu = true

[auth.basic]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
preinstall_sync = marcusolsson-dynamictext-panel@6.3.0,grafana-metricsdrilldown-app@3.0.0
disable_plugins = grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-advisor-app

[unified_alerting]
enabled = false
