apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: grafana
    namespace: grafana
    files:
      - grafana.ini
      - datasources.yaml
      - dashboards.yaml
  - name: grafana-dashboards
    namespace: grafana
    files:
      - dashboards/k3s-control-plane.json
