apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: files
  namespace: files
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: files
    template:
      engineVersion: v2
      data:
        ssh_host_ed25519_key: |
          {{ .ssh_host_ed25519_key | trim }}
        accounts: |
          {{- $accounts := dict }}
          {{- range $name, $user := .users | fromJson }}
          {{- if $user.hfs_srp }}
          {{- $_ := set $accounts $name (dict "srp" $user.hfs_srp "disable_password_change" true) }}
          {{- end }}
          {{- end }}
          {{- $accounts | toJson -}}
  data:
    - secretKey: users
      remoteRef:
        key: users
    - secretKey: ssh_host_ed25519_key
      remoteRef:
        key: files/ssh-host-key
