apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: files-sftp
  namespace: files
spec:
  # The entrypoint is declared in Traefik's HelmChartConfig
  # (initialization/traefik). SSH carries no SNI, so the rule matches any
  # connection and the entrypoint itself is the routing decision.
  entryPoints:
    - sftp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: files
          port: 3922
