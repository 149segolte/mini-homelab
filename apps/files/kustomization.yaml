apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - ingressroute-tcp.yaml

configMapGenerator:
  - name: files
    namespace: files
    files:
      - config.yaml
      - sshd_config
      - passwd
      - authorized_keys
