apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: files
  namespace: files
  annotations:
    glance/name: Files
    glance/icon: di:files
    glance/url: https://files.${DOMAIN}
spec:
  ingressClassName: traefik
  rules:
    - host: files.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: files
                port:
                  name: http
    - host: dav.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: files
                port:
                  name: http
